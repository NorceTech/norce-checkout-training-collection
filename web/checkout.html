<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCO Checkout Snippet</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    p.help { color: #555; font-size: 14px; }
    textarea { width: 100%; min-height: 160px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; box-sizing: border-box; }
    button { background: #000; color: #fff; border: 0; padding: 10px 18px; font-size: 14px; cursor: pointer; border-radius: 4px; margin-top: 8px; }
    #checkout-container { margin-top: 24px; border: 1px dashed #ccc; min-height: 80px; padding: 8px; }
    .status { font-size: 13px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>NCO – snippet-test för Kustom och Walley</h1>
  <p class="help">
    Kör <strong>Initiate Payment</strong> i Bruno, kopiera svaret och klistra in det nedan.
    Du kan klistra in antingen hela JSON-svaret (med <code>htmlSnippet</code>) eller bara select själva snippet-HTML:en.
    Klicka sedan <strong>Rendera</strong> så bäddas Kustom- eller Walley-checkouten in nedanför.
  </p>

  <textarea id="snippet-input" placeholder='{ "id": "...", "status": "checkout_incomplete", "htmlSnippet": "<div id=\"klarna-checkout-container\">...</div>" }'></textarea>
  <br />
  <button id="render-btn">Rendera</button>
  <div class="status" id="status"></div>

  <div id="checkout-container"></div>

  <script>
    // Tar en sträng som antingen är hela JSON-svaret eller ren snippet-HTML
    // och returnerar snippet-HTML:en.
    function extractSnippet(raw) {
      const text = raw.trim();
      if (!text) return null;
      // Försök tolka som JSON först
      let obj;
      try {
        obj = JSON.parse(text);
      } catch (e) {
        // inte JSON – anta att det redan är snippet-HTML
      }
      // Giltig JSON: använd bara htmlSnippet, rendera aldrig resten av svaret
      if (obj !== undefined) return obj && typeof obj.htmlSnippet === "string" ? obj.htmlSnippet : null;
      if (text.includes("klarna-checkout-container") || text.includes("<script")) return text;
      return null;
    }

    // Injicerar snippet och kör om <script>-taggarna (annars exekveras de inte
    // när man sätter innerHTML).
    function renderSnippet(container, snippetHtml) {
      container.innerHTML = snippetHtml;
      const scripts = Array.from(container.querySelectorAll("script"));
      for (const oldScript of scripts) {
        const newScript = document.createElement("script");
        for (const attr of oldScript.attributes) {
          newScript.setAttribute(attr.name, attr.value);
        }
        newScript.text = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      }
    }

    document.getElementById("render-btn").addEventListener("click", function () {
      const status = document.getElementById("status");
      const raw = document.getElementById("snippet-input").value;
      const snippet = extractSnippet(raw);
      const container = document.getElementById("checkout-container");
      if (!snippet) {
        status.textContent = "Hittade ingen htmlSnippet i det du klistrade in.";
        container.innerHTML = "";
        return;
      }
      status.textContent = "Renderar snippet…";
      renderSnippet(container, snippet);
    });
  </script>
</body>
</html>
